version: '3.9'

services:
# 1. Data Warehouse
  postgres:
    image: postgres:15
    container_name: elt_postgres
    environment:
      POSTGRES_USER: dbt_user
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: ecom_warehouse
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - elt_network
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U dbt_user -d ecom_warehouse"]
        interval: 10s
        timeout: 5s
        retries: 5

# 2. Herramienta de visualización (BI)
metabase:
  image: metabase/metabase:latest
  container_name: elt_metabase
  ports:
    - "3000:3000"
  environment:
  # Configuramos Metabase para que use la misma base de datos de Postgres para guardar su propia configuración
    MB_DB_TYPE: postgres
    MB_DB_DBNAME: ecom_warehouse
    MB_DB_PORT: 5432
    MB_DB_USER: dbt_user
    MB_DB_PASS: 123
    MB_DB_HOST: postgres # Usa el nombre del servicio para conectarse en la red interna  depends_on:
    postgres:
      condition: service_healthy # Metabase espera a que Postgres esté listo
  networks:
    - elt_network

# Definimos la red para que los servicios puedan comunicarse entre sí
networks: 
  elt_network:
    driver: bridge

# Definimos un volumen para persistir los datos de Postgres
volumes:
  postgres_data: